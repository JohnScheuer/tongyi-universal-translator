[package]
name = "tongyi-translator"
version = "0.1.0"
edition = "2021"
description = "TōngYì (通译) — Universal hotkey translator"
license = "MIT"
repository = "https://github.com/JohnScheuer/tongyi-translator"

[[bin]]
name = "tongyi"
path = "src/main.rs"

[dependencies]
# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# HTTP (API engines)
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde_json = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Date/time
chrono = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
# Win32 API
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
]}
clipboard-win = "5"
winrt-notification = "0.5"

[build-dependencies]
embed-resource = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
